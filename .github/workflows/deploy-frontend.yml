# Deploy TravelPilot Frontend to GitHub Pages
# Builds the Vite React app and deploys to GitHub Pages using official Actions

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: travelpilot/frontend/package-lock.json

      - name: Install dependencies
        working-directory: travelpilot/frontend
        run: npm ci

      - name: Build production bundle
        working-directory: travelpilot/frontend
        run: npm run build

      # Copy index.html as 404.html for SPA client-side routing fallback
      - name: Create SPA fallback
        working-directory: travelpilot/frontend/dist
        run: cp index.html 404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: travelpilot/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
